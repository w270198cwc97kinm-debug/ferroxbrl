[package]
name = "ferroxbrl-py"
description = "Python bindings for ferroxbrl (fast inline XBRL extraction)"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/w270198cwc97kinm-debug/ferroxbrl"

[lib]
name = "ferroxbrl"
crate-type = ["cdylib"]

[dependencies]
ferroxbrl-core = { path = "../ferroxbrl-core" }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json = "1"
