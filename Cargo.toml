[workspace]
resolver = "2"
members = ["crates/ferroxbrl-core", "crates/ferroxbrl-cli"]
# ferroxbrl-py is built via maturin (extension-module), excluded from the
# default `cargo build/test --workspace` to avoid Python link requirements.
exclude = ["crates/ferroxbrl-py"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/w270198cwc97kinm-debug/ferroxbrl"

[workspace.dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
